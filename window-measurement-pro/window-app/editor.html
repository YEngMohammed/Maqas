<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#134d8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>محرر مقاسات المشروع</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-topbar" id="topbar"></header>

  <main class="page">
    <div class="card card-pad header-card">
      <div class="info-grid">
        <div><div class="k">اسم العميل</div><div class="v" id="h-client">—</div></div>
        <div><div class="k">الموقع</div><div class="v" id="h-location">—</div></div>
        <div><div class="k">رقم التواصل</div><div class="v" id="h-phone">—</div></div>
        <div><div class="k">تاريخ الإنشاء</div><div class="v" id="h-date">—</div></div>
        <div><div class="k">الوقت الحالي</div><div class="v" id="h-now">—</div></div>
      </div>
      <div class="export-row no-print">
        <button class="btn btn-outline btn-sm" id="export-excel-btn">📊 تصدير Excel</button>
        <button class="btn btn-outline btn-sm" id="export-pdf-btn">📄 تصدير PDF المقاسات</button>
        <button class="btn btn-outline btn-sm" id="export-models-btn">🖼️ تصدير كراسة النماذج</button>
      </div>
    </div>

    <div class="card card-pad no-print" style="margin-bottom:18px;">
      <h3 style="margin-bottom:14px; font-size:15px;" id="form-mode-label">إضافة مقاس جديد</h3>
      <form id="measure-form" class="form-grid" onsubmit="return false;">
        <div class="field">
          <label>رقم الشباك</label>
          <input id="f-pos" type="text" placeholder="تلقائي" style="font-weight:700; text-align:center;">
        </div>
        <div class="field">
          <label>العرض (سم)</label>
          <input id="f-width" type="number" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>الارتفاع (سم)</label>
          <input id="f-height" type="number" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>جالس يمين (سم)</label>
          <input id="f-sillRight" type="number" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>جالس شمال (سم)</label>
          <input id="f-sillLeft" type="number" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>العدد</label>
          <input id="f-qty" type="number" min="1" step="1" value="1">
        </div>
        <div class="field">
          <label>المساحة (م²)</label>
          <input id="f-area" type="text" readonly value="0.00">
        </div>
        <div class="field">
          <label>الاتجاه</label>
          <select id="f-orientation"></select>
        </div>
        <div class="field">
          <label>النوع</label>
          <select id="f-type"></select>
        </div>
        <div class="field">
          <label>رقم نموذج التصميم</label>
          <input id="f-model" type="text" readonly placeholder="اضغط للاختيار من الكتالوج" style="cursor:pointer;">
        </div>
        <div class="field" style="grid-column: span 3;">
          <label>ملاحظات</label>
          <input id="f-notes" type="text" placeholder="اختياري">
        </div>
      </form>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-primary" id="save-row-btn">حفظ / إضافة المقاس</button>
        <button class="btn btn-outline" id="cancel-edit-btn" style="display:none;">إلغاء التعديل</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>رقم الشباك</th><th>العرض(سم)</th><th>الارتفاع(سم)</th><th>جالس يمين</th>
            <th>جالس شمال</th><th>العدد</th><th>المساحة(م²)</th><th>الاتجاه</th>
            <th>النوع</th><th>رقم النموذج</th><th>ملاحظات</th><th class="no-print">إجراءات</th>
          </tr>
        </thead>
        <tbody id="measure-tbody"></tbody>
        <tfoot id="measure-tfoot"></tfoot>
      </table>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="lib/xlsx.full.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';"></script>
  <script src="lib/html2pdf.bundle.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';"></script>
  <script src="js/export.js"></script>
  <script src="js/measurements.js"></script>
</body>
</html>
